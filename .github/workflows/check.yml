name: check

on:
  push:
  pull_request:

jobs:
  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: bash syntax
        run: |
          for f in install.command uninstall.command lib/common.sh bin/auto_fill_shokz.sh; do
            bash -n "$f"
          done

      - name: shellcheck
        run: shellcheck -S warning install.command uninstall.command lib/common.sh bin/auto_fill_shokz.sh

  installer:
    name: installer tests
    # macOS, because the installer calls diskutil, plutil and codesign, and the
    # tests stub launchctl rather than mocking the whole platform.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Declare the dependency here rather than letting the test install it. The
      # installer needs a non-platform bash and jq, and a cold runner without them
      # turns a 45-second suite into a very slow one.
      - name: dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install bash jq || true
          command -v jq
          test -x /opt/homebrew/bin/bash && /opt/homebrew/bin/bash --version | head -1

      - name: tests
        run: bash tests/run.sh
